<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Beheer · Hart voor Zorg programmaboekje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,500;1,8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/editor.css">
</head>
<body class="editor">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Hart voor Zorg</span></a>
    <div class="title"><h1>Beheer programmaboekje</h1><p id="status">Laden…</p></div>
    <div class="ed-top-actions">
      <label class="ed-select"><span class="sr">Festival</span><select id="ev-select"></select></label>
      <button type="button" class="btn" id="btn-import">Importeer</button>
      <button type="button" class="btn" id="btn-export">Download JSON</button>
      <button type="button" class="btn primary" id="btn-preview">Bekijk voorbeeld</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
    </div>
  </header>
  <nav class="tabs" id="ed-tabs" aria-label="Onderdelen">
    <button type="button" data-tab="algemeen">Algemeen</button>
    <button type="button" data-tab="programma">Programma</button>
    <button type="button" data-tab="partners">Standhouders</button>
    <button type="button" data-tab="kaart">Plattegrond</button>
    <button type="button" data-tab="controle">Controle <span id="issue-count" class="count" hidden></span></button>
  </nav>
  <main id="ed-main" class="ed-main"></main>
  <script type="module" src="assets/editor.js"></script>
</body>
</html>
