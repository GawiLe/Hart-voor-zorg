<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00513b">
  <title>Programma · Hart voor Zorg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,500;1,8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div id="app" class="app" aria-busy="true">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Alle festivals">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Hart voor Zorg</span>
      </a>
      <div class="title">
        <h1 id="ev-name">Programmaboekje</h1>
        <p id="ev-sub"></p>
      </div>
    </header>
    <div id="live" class="live" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Onderdelen"></nav>
    <main class="layout">
      <section class="panel" id="panel" tabindex="-1"></section>
      <section class="mapwrap" id="mapwrap" aria-label="Plattegrond">
        <div class="map-search">
          <label class="search">
            <span class="sr">Zoek stand of organisatie</span>
            <input id="map-q" type="search" placeholder="Zoek stand, organisatie of zaal" autocomplete="off">
          </label>
          <ul id="map-suggest" class="suggest" hidden></ul>
        </div>
        <div id="map" class="map"></div>
        <div class="map-ctrl">
          <button type="button" data-zoom="in" aria-label="Inzoomen"></button>
          <button type="button" data-zoom="out" aria-label="Uitzoomen"></button>
          <button type="button" data-zoom="reset" aria-label="Hele plattegrond"></button>
        </div>
        <div id="route-bar" class="route-bar" hidden></div>
      </section>
    </main>
    <div id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <button type="button" class="sheet-close" aria-label="Sluiten"></button>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
